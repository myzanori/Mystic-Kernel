name: Build Mystic Kernel & Release to Telegram

on:
  push:
    branches:
      - main
      - 'v*'
    tags:
      - 'v*'
      - 'mystic-*'
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel & Post to Telegram
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo add-apt-repository universe -y
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git \
            libssl-dev libelf-dev libncurses-dev libz3-dev libtinfo5 \
            lzop rsync zip zlib1g-dev python3 python3-pip
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5 2>/dev/null || true
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 2>/dev/null || true

      - name: Setup ZyC Clang 10 Toolchain
        run: |
          mkdir -p "$GITHUB_WORKSPACE/clang-10"
          curl -sL "https://github.com/ZyCromerZ/Clang/releases/download/10.0.1-20220724-release/Clang-10.0.1-20220724.tar.gz" -o /tmp/clang.tar.gz
          tar -xzf /tmp/clang.tar.gz -C "$GITHUB_WORKSPACE/clang-10"
          rm -f /tmp/clang.tar.gz
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/clang-10/lib" >> $GITHUB_ENV
          echo "Clang version:"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/clang-10/lib"
          "$GITHUB_WORKSPACE/clang-10/bin/clang" --version

      - name: Setup AOSP GCC 4.9 Toolchains
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git -b android12L-release "$GITHUB_WORKSPACE/gcc-64"
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git -b android12L-release "$GITHUB_WORKSPACE/gcc-32"

      - name: Build Kernel & Package Single AnyKernel3 Zip
        env:
          CLANG_DIR: ${{ github.workspace }}/clang-10
          GCC64_DIR: ${{ github.workspace }}/gcc-64
          GCC32_DIR: ${{ github.workspace }}/gcc-32
        run: |
          bash build_tools/build_anykernel.sh

      - name: Upload Single AnyKernel3 Zip to Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          RELEASE_TAG: "v1.0.30"
        run: |
          python3 build_tools/send_telegram.py

      - name: Upload AnyKernel3 Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Mystic-Kernel-OnePlus9R-OOS14-AnyKernel3
          path: release_out/*.zip
          if-no-files-found: error
