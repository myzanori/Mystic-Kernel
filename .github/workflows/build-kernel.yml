name: Build Mystic Kernel (All Targets)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Kernel & Publish Release
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Dynamic Version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          . ./mystic_version.sh
          echo "MYSTIC_VERSION=$MYSTIC_VERSION" >> $GITHUB_ENV
          echo "MYSTIC_BUILD=$MYSTIC_BUILD" >> $GITHUB_ENV
          echo "Building Mystic Kernel version: $MYSTIC_VERSION (Build $MYSTIC_BUILD)"

      - name: Install Build Dependencies
        run: |
          sudo add-apt-repository universe -y
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git \
            libssl-dev libelf-dev libncurses-dev libz3-dev libtinfo5 \
            lzop rsync zip zlib1g-dev python3 python3-pip
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5 2>/dev/null || true
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 2>/dev/null || true

      - name: Cache Toolchains
        id: cache-toolchains
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/clang-10
            ${{ github.workspace }}/gcc-64
            ${{ github.workspace }}/gcc-32
          key: toolchains-zyc-clang10-gcc49-v1

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Setup ZyC Clang 10 Toolchain
        if: steps.cache-toolchains.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/clang-10"
          curl -sL "https://github.com/ZyCromerZ/Clang/releases/download/10.0.1-20220724-release/Clang-10.0.1-20220724.tar.gz" -o /tmp/clang.tar.gz
          tar -xzf /tmp/clang.tar.gz -C "$GITHUB_WORKSPACE/clang-10"
          rm -f /tmp/clang.tar.gz

      - name: Setup AOSP GCC 4.9 Toolchains
        if: steps.cache-toolchains.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git -b android12L-release "$GITHUB_WORKSPACE/gcc-64"
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git -b android12L-release "$GITHUB_WORKSPACE/gcc-32"

      - name: Verify Toolchain Environment
        run: |
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/clang-10/lib" >> $GITHUB_ENV
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/clang-10/lib"
          "$GITHUB_WORKSPACE/clang-10/bin/clang" --version

      - name: Build All 3 Kernel Packages (COS, AOSP, OOS)
        env:
          CLANG_DIR: ${{ github.workspace }}/clang-10
          GCC64_DIR: ${{ github.workspace }}/gcc-64
          GCC32_DIR: ${{ github.workspace }}/gcc-32
        run: |
          bash build_tools/build_anykernel.sh all

      - name: Extract Commit Changelog
        id: changelog
        run: |
          COMMIT_TITLE="$(git log -1 --pretty=%s)"
          COMMIT_BODY="$(git log -1 --pretty=%b)"
          COMMIT_HASH="$(git rev-parse --short HEAD)"
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"

          {
            echo "title<<EOF"
            echo "$COMMIT_TITLE"
            echo "EOF"
            echo "body<<EOF"
            echo "### Commit: $COMMIT_HASH"
            echo ""
            echo "**$COMMIT_TITLE**"
            if [ -n "$COMMIT_BODY" ]; then
              echo ""
              echo "$COMMIT_BODY"
            fi
            echo ""
            echo "---"
            echo "[View Commit on GitHub]($COMMIT_URL)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release & Tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mystic-v${{ env.MYSTIC_VERSION }}
          name: Mystic Kernel v${{ env.MYSTIC_VERSION }}
          body: |
            ${{ steps.changelog.outputs.body }}
          files: release_out/*.zip
          generate_release_notes: false
          draft: false
          prerelease: false

      - name: Upload Release Files and Post to Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 build_tools/send_telegram.py

      - name: Upload Release Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Mystic-Kernel-v${{ env.MYSTIC_VERSION }}
          path: release_out/*.zip
          if-no-files-found: error
