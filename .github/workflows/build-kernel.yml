name: Build Mystic Kernel (Parallel Matrix)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [cos, oos]

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Determine Dynamic Version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          . ./mystic_version.sh
          echo "MYSTIC_VERSION=$MYSTIC_VERSION" >> $GITHUB_ENV
          echo "MYSTIC_BUILD=$MYSTIC_BUILD" >> $GITHUB_ENV
          echo "Building Mystic Kernel version: $MYSTIC_VERSION (Build $MYSTIC_BUILD) for ${{ matrix.target }}"

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison ccache flex libelf-dev libncurses-dev libssl-dev libtinfo5 lzop
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5 2>/dev/null || true
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 2>/dev/null || true

      - name: Cache Toolchains
        id: cache-toolchains
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/clang-10
            ${{ github.workspace }}/gcc-64
            ${{ github.workspace }}/gcc-32
          key: toolchains-zyc-clang10-gcc49-v1

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.target }}-
            ccache-${{ runner.os }}-

      - name: Setup ZyC Clang 10 Toolchain
        if: steps.cache-toolchains.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/clang-10"
          curl -sL "https://github.com/ZyCromerZ/Clang/releases/download/10.0.1-20220724-release/Clang-10.0.1-20220724.tar.gz" -o /tmp/clang.tar.gz
          tar -xzf /tmp/clang.tar.gz -C "$GITHUB_WORKSPACE/clang-10"
          rm -f /tmp/clang.tar.gz

      - name: Setup AOSP GCC 4.9 Toolchains
        if: steps.cache-toolchains.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 --single-branch -b android12L-release https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git "$GITHUB_WORKSPACE/gcc-64"
          git clone --depth=1 --single-branch -b android12L-release https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git "$GITHUB_WORKSPACE/gcc-32"

      - name: Verify Toolchain Environment
        run: |
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/clang-10/lib" >> $GITHUB_ENV
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/clang-10/lib"
          "$GITHUB_WORKSPACE/clang-10/bin/clang" --version

      - name: Build Kernel Target (${{ matrix.target }})
        env:
          CCACHE_MAXSIZE: 10G
          CCACHE_COMPILERCHECK: content
          CCACHE_COMPRESS: 1
          CCACHE_COMPRESSLEVEL: 1
          CCACHE_NOHASHDIR: 1
          CLANG_DIR: ${{ github.workspace }}/clang-10
          GCC64_DIR: ${{ github.workspace }}/gcc-64
          GCC32_DIR: ${{ github.workspace }}/gcc-32
        run: |
          bash build_tools/build_anykernel.sh ${{ matrix.target }}

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.target }}
          path: release_out/*.zip
          if-no-files-found: error

  release:
    name: Publish Release & Send Telegram
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source (for metadata & scripts)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Determine Dynamic Version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          . ./mystic_version.sh
          echo "MYSTIC_VERSION=$MYSTIC_VERSION" >> $GITHUB_ENV
          echo "MYSTIC_BUILD=$MYSTIC_BUILD" >> $GITHUB_ENV
          echo "Releasing Mystic Kernel version: $MYSTIC_VERSION (Build $MYSTIC_BUILD)"

      - name: Download Built Kernel Packages
        uses: actions/download-artifact@v4
        with:
          pattern: kernel-*
          path: release_out
          merge-multiple: true

      - name: Verify Downloaded Packages
        run: |
          ls -lh release_out/*.zip

      - name: Extract Release Changelog
        id: changelog
        run: |
          COMMIT_HASH="$(git rev-parse --short HEAD)"
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          if [ -f "RELEASE_CHANGELOG.md" ]; then
            NOTES="$(cat RELEASE_CHANGELOG.md)"
          else
            NOTES="$(git log -1 --pretty=%s)"
          fi

          {
            echo "body<<EOF"
            echo "### Mystic Kernel v${{ env.MYSTIC_VERSION }}"
            echo ""
            echo "$NOTES"
            echo ""
            echo "---"
            echo "[View Commit: $COMMIT_HASH]($COMMIT_URL)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release & Tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mystic-v${{ env.MYSTIC_VERSION }}
          name: Mystic Kernel v${{ env.MYSTIC_VERSION }}
          body: |
            ${{ steps.changelog.outputs.body }}
          files: release_out/*.zip
          generate_release_notes: false
          draft: false
          prerelease: false

      - name: Upload Release Files and Post to Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 build_tools/send_telegram.py

      - name: Upload Consolidated Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mystic-Kernel-v${{ env.MYSTIC_VERSION }}-All
          path: release_out/*.zip
          if-no-files-found: error
